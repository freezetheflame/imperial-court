[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["imperial", "imperial.storage", "imperial.institution", "imperial.rule_engine", "imperial.bus", "imperial.agent", "imperial.court"]

[project]
name = "imperial-court"
version = "0.1.0"
description = "制度是一等公民的多 agent 编排系统 — 古代政治制度作为可换装的编排层"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
